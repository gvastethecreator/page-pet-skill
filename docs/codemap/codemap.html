<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code map · page-mascot-local</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #050505;
      --paper-2: #101010;
      --pattern: rgba(255, 255, 255, .012);
      --node-paper: #141414;
      --ink: #f5f5f5;
      --muted: #b0b0b0;
      --soft: #8a8a8a;
      --chrome-line: rgba(255, 255, 255, .02);
      --chrome-radius: 12px;
      --rule: rgba(255, 255, 255, .12);
      --rule-solid: #3a3a3a;
      --grid: rgba(255, 255, 255, .035);
      --wash-2: rgba(255, 255, 255, .03);
      --wash-3: rgba(255, 255, 255, .04);
      --wash-6: rgba(255, 255, 255, .07);
      --wash-10: rgba(255, 255, 255, .1);
      --wash-30: rgba(255, 255, 255, .28);
      --accent: #ffffff;
      --accent-tint: rgba(255, 255, 255, .08);
      --link: #4da3ff;
      --connector: #6e6e6e;
      --connector-dim: #2a2a2a;
      --edge-imports: #3d8fff;
      --edge-calls: #c45cff;
      --edge-reads: #3ec2ff;
      --edge-writes: #ffc107;
      --edge-publishes: #ff6a2a;
      --edge-subscribes: #ff3d8a;
      --edge-unknown: #ff3b3b;
      --card-shadow: transparent;
      --boundary-saturation: 64%;
      --boundary-lightness: 47%;
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --ease-in: cubic-bezier(.4, 0, 1, 1);
      --ease-in-out: cubic-bezier(.45, 0, .15, 1);
      --motion-quick: 140ms;
      --motion-panel: 220ms;
      --motion-camera: 280ms;
      --edge-registers: #a5a0ff;
    }

    .skip {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 20;
      padding: 6px 10px;
      background: var(--paper-2);
      color: var(--ink);
      border: 1px solid var(--rule-solid);
      transform: translateY(-120%);
    }
    .skip:focus { transform: none; }
    * { box-sizing: border-box; }
    * { scrollbar-color: var(--rule-solid) var(--paper-2); scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: var(--paper-2); }
    *::-webkit-scrollbar-thumb {
      border: 2px solid var(--paper-2);
      background: var(--rule-solid);
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font: 12px/1.45 var(--sans);
    }
    button, input { font: inherit; color: inherit; }
    .eyebrow {
      margin: 0;
      color: var(--soft);
      font: 10px/1.2 var(--mono);
      letter-spacing: .04em;
      text-transform: none;
    }
    header, .eyebrow, .head-right, .meta { display: none; }
    .map-head {
      position: absolute;
      z-index: 5;
      top: 8px;
      left: 8px;
      max-width: min(360px, calc(100% - 280px));
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .map-head h1 { margin: 0; font: 600 16px/1.2 var(--mono); overflow-wrap: anywhere; }
    .map-head .map-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0 0; color: var(--soft); font: 12px/1.3 var(--mono); }
    .map-head .map-time { display: none; }
    .card-legend {
      position: absolute;
      z-index: 5;
      left: 8px;
      bottom: 36px;
      min-width: 148px;
      max-width: 240px;
      max-height: 42vh;
      overflow: auto;
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .card-legend .legend-title { margin: 0 0 8px; color: var(--soft); font: 12px/1.2 var(--mono); }
    .card-legend .boundary-chip {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 4px;
      background: var(--group-color);
    }
    .left .section:has(#boundary-legend) { display: none; }

    main {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      position: relative;
    }
    aside {
      position: absolute;
      z-index: 9;
      top: 108px;
      bottom: 60px;
      min-width: 0;
      overflow: auto;
      background: var(--paper-2);
      border: 2px solid var(--chrome-line);
      border-radius: 16px;
      transition: opacity var(--motion-panel) var(--ease-out), transform var(--motion-panel) var(--ease-out), visibility var(--motion-panel);
    }
    main[data-left-collapsed="true"] .left,
    main[data-right-collapsed="true"] .right {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .left { left: 12px; width: 236px; padding: 18px; }
    .right { right: 12px; width: 320px; padding: 20px; user-select: text; }
    main[data-left-collapsed="true"] .left { transform: translateX(-12px); }
    main[data-right-collapsed="true"] .right { transform: translateX(12px); }
    .section { margin-bottom: 14px; }
    .section-title { margin: 0 0 6px; color: var(--soft); font: 10px/1.3 var(--mono); letter-spacing: 0; text-transform: none; }
    input[type="search"] {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      font-family: var(--mono);
    }
    input[type="search"]:focus { border-color: var(--ink); }
    .filter, .legend-row { display: flex; align-items: center; gap: 8px; min-height: 26px; }
    .filter { cursor: pointer; }
    .filter input { accent-color: var(--ink); width: 13px; height: 13px; margin: 0; }
    .filter code, .legend-row code { font: 12px/1 var(--mono); letter-spacing: 0; color: var(--soft); }
    .type-key { width: 72px; flex: 0 0 auto; color: var(--muted); font: 12px/1 var(--mono); letter-spacing: 0; }
    .boundary-chip { width: 12px; height: 12px; flex: 0 0 auto; border: 1px solid var(--group-color); background: color-mix(in srgb, var(--group-color) 18%, var(--paper)); }
    .edge-key { position: relative; width: 20px; height: 8px; flex: 0 0 auto; color: var(--edge-color); }
    .edge-key::before { content: ""; position: absolute; top: 3px; left: 0; width: 15px; border-top: 2px solid currentColor; }
    .edge-key::after { content: ""; position: absolute; top: 1px; right: 0; border-top: 3px solid transparent; border-bottom: 3px solid transparent; border-left: 5px solid currentColor; }
    .rule-chip { width: 16px; height: 0; flex: 0 0 auto; border-top: 2px solid var(--connector); }
    .rule-chip[data-state="selected"] { border-top-color: var(--accent); }
    .rule-chip[data-state="callers"] { border-top-color: var(--link); }
    .rule-chip[data-state="dependencies"] { border-top-color: var(--ink); }
    .rule-chip[data-state="flow"] { border-top-color: var(--accent); }
    .rule-chip[data-state="unknown"] { border-top-style: dashed; border-top-color: var(--edge-unknown); }
    .flow-button {
      width: 100%;
      margin: 0 0 6px;
      padding: 7px 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .flow-button { transition: border-color 140ms ease-out, background-color 140ms ease-out, color 140ms ease-out; }
    .flow-button:hover, .flow-button:focus-visible { border-color: var(--ink); outline: none; }
    .flow-button.active { border-color: var(--ink); background: var(--accent-tint); }
    .flow-button.related { border-color: var(--link); }
    .flow-button small { display: block; margin-top: 4px; color: var(--muted); font: 10px/1.4 var(--mono); }

    .map-shell {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--pattern) 1px, transparent 1px),
        linear-gradient(90deg, var(--pattern) 1px, transparent 1px);
      background-size: 16px 16px;
      -webkit-user-select: none;
      user-select: none;
    }
    .toolbar {
      position: absolute;
      z-index: 4;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
    }
    .toolbar input[type="search"] {
      width: 176px;
      height: 28px;
      margin: 0;
      padding: 0 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      outline: none;
      background: var(--paper);
      font: 13px/1 var(--mono);
    }
    .toolbar input[type="search"]:focus { border-color: var(--ink); }
    .toolbar button {
      min-width: 30px;
      height: 28px;
      padding-inline: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font: 12px/1 var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: border-color 140ms ease-out, color 140ms ease-out, background-color 140ms ease-out, opacity 140ms ease-out;
    }
    .toolbar button:hover, .toolbar button:focus-visible { border-color: var(--ink); color: var(--ink); outline: 1px solid var(--ink); outline-offset: 1px; }
    .toolbar button[aria-expanded="false"] { color: var(--soft); background: var(--wash-6); }
    .toolbar button:disabled { cursor: not-allowed; opacity: .38; }
    .toolbar-separator { width: 1px; margin: 4px 2px; background: var(--rule); }
    #map-svg { width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
    .map-bg { fill: transparent; }

    #arrow-muted path { fill: var(--connector); }
    #arrow-ink path { fill: var(--ink); }
    #arrow-link path { fill: var(--link); }
    #arrow-accent path { fill: var(--accent); }
    #arrow-soft path { fill: var(--connector-dim); }
    #arrow-imports path { fill: var(--edge-imports); }
    #arrow-calls path { fill: var(--edge-calls); }
    #arrow-reads path { fill: var(--edge-reads); }
    #arrow-writes path { fill: var(--edge-writes); }
    #arrow-publishes path { fill: var(--edge-publishes); }
    #arrow-subscribes path { fill: var(--edge-subscribes); }
    #arrow-unknown path { fill: var(--edge-unknown); }

    .zone, .zone-mask, .zone-label { display: none; }

    [data-edge-type="imports"] { --edge-color: var(--edge-imports); }
    [data-edge-type="calls"] { --edge-color: var(--edge-calls); }
    [data-edge-type="reads"] { --edge-color: var(--edge-reads); }
    [data-edge-type="writes"] { --edge-color: var(--edge-writes); }
    [data-edge-type="publishes"] { --edge-color: var(--edge-publishes); }
    [data-edge-type="subscribes"] { --edge-color: var(--edge-subscribes); }
    .edge {
      fill: none;
      stroke: var(--edge-paint, var(--edge-color, var(--connector)));
      stroke-width: 1.75;
      marker-end: url(#arrow-muted);
      pointer-events: stroke;
      cursor: crosshair;
      transition: stroke-width 180ms var(--ease-in), opacity 180ms var(--ease-in);
    }
    .edge-blend-from,
    .edge-blend-to {
      stop-color: var(--edge-color, var(--connector));
      transition: stop-color 180ms var(--ease-in);
    }
    .edge-blend-mid {
      stop-color: var(--edge-color, var(--connector));
    }
    .edge-bundle.blend .edge-blend-from {
      stop-color: var(--from-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-bundle.blend .edge-blend-to {
      stop-color: var(--to-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 48;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: crosshair;
    }
    .edge-march {
      fill: none;
      stroke: color-mix(in srgb, var(--edge-color, var(--connector)) 55%, #ffffff);
      stroke-width: 3.25;
      stroke-dasharray: 11 9;
      stroke-linecap: round;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms var(--ease-in);
    }
    .edge-march.on,
    .edge-hit:hover + .edge + .edge-march {
      opacity: 1;
      transition: opacity 240ms var(--ease-out);
      animation: edge-flow 640ms linear infinite;
    }
    @keyframes edge-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -20; }
    }
    .edge[data-edge-type="imports"] { marker-end: url(#arrow-imports); }
    .edge[data-edge-type="calls"] { marker-end: url(#arrow-calls); }
    .edge[data-edge-type="reads"] { marker-end: url(#arrow-reads); }
    .edge[data-edge-type="writes"] { marker-end: url(#arrow-writes); }
    .edge[data-edge-type="publishes"] { marker-end: url(#arrow-publishes); }
    .edge[data-edge-type="subscribes"] { marker-end: url(#arrow-subscribes); }
    .edge.unknown { --edge-color: var(--edge-unknown); stroke-width: 1.75; stroke-dasharray: 5 4; marker-end: url(#arrow-unknown); }
    .edge.hot {
      stroke-width: 2.75;
      opacity: 1;
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.flow {
      --edge-color: var(--accent);
      stroke-width: 2.75;
      marker-end: url(#arrow-accent);
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.dim { stroke-width: 1.25; opacity: .12; }
    .edge-mask { fill: var(--paper); pointer-events: none; }
    .edge-label { fill: var(--edge-color, var(--connector)); font: 600 11px var(--mono); letter-spacing: 0; pointer-events: none; }

    @media (hover: hover) and (pointer: fine) {
      .edge:hover, .edge-hit:hover + .edge {
        stroke-width: 3;
        opacity: 1;
      }
    }

    .node {
      cursor: grab;
      outline: none;
      --fill: var(--group-color);
      transition: opacity 140ms ease-out;
    }
    .node:active { cursor: grabbing; }
    .node.hot, .node.flow, .node.match { opacity: 1; }
    .node.focus { opacity: 1; }
    .node .card-visual { transform-box: fill-box; transform-origin: center; }
    .node .card-shadow, .node .card-head, .node .card-rule, .node .group-rail, .node .tag { display: none; }
    .node .box { fill: var(--fill); stroke: none; }
    .node .card-lip { fill: url(#card-lip); pointer-events: none; }
    .node .card-scrim { pointer-events: none; }
    .node .wash-a,
    .node .wash-b,
    .node .wash-c {
      transition: stop-color 180ms var(--ease-out), stop-opacity 180ms var(--ease-out);
    }
    .node .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .wash-b {
      stop-color: color-mix(in srgb, var(--group-color) 36%, #0a0a0a);
      stop-opacity: .4;
    }
    .node .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .tag-text { fill: rgba(255, 255, 255, .86); font: 600 11px var(--mono); letter-spacing: .06em; }
    .node .boundary-stamp,
    .node .node-title,
    .node .node-path { dominant-baseline: hanging; }
    .node .boundary-stamp { fill: rgba(255, 255, 255, .82); font: 13px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-title { fill: #ffffff; font: 600 20px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-path { fill: rgba(255, 255, 255, .88); font: 15px/1.2 var(--sans); }
    .node.dim { opacity: .14; }

    .empty { color: var(--muted); }
    .detail-title { margin: 0 0 2px; font: 600 16px/1.25 var(--mono); letter-spacing: 0; overflow-wrap: anywhere; }
    .detail-path { margin: 0 0 12px; color: var(--muted); font: 11px/1.4 var(--mono); overflow-wrap: anywhere; }
    .detail-block { margin: 0 0 12px; }
    .detail-block h3 { margin: 0 0 4px; color: var(--soft); font: 10px var(--mono); letter-spacing: 0; text-transform: none; }
    .detail-block p { margin: 0; overflow-wrap: anywhere; }
    .detail-block ul { margin: 0; padding-left: 16px; }
    .detail-block li { overflow-wrap: anywhere; }
    .detail-block code, .detail-block li { font-family: var(--mono); }
    .detail-boundary { color: var(--group-color); }
    .test-list { padding: 8px; border: 1px solid var(--rule-solid); background: var(--paper); }
    .detail-action {
      width: 100%;
      min-height: 32px;
      margin: 0 0 12px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--accent-tint);
      cursor: pointer;
      font: 600 11px var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: background-color 140ms ease-out;
    }
    .detail-action:hover, .detail-action:focus-visible { background: var(--paper); outline: 1px solid var(--ink); outline-offset: 1px; }
    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 0 4px;
      border: 1px solid var(--rule-solid);
      color: var(--soft);
      font: 10px/16px var(--mono);
      letter-spacing: 0;
      text-transform: none;
    }
    .status-line {
      position: absolute;
      right: 8px;
      left: auto;
      bottom: 8px;
      max-width: min(420px, calc(100% - 16px));
      padding: 6px 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      font: 12px/1.4 var(--mono);
      letter-spacing: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      main { --left-column: 200px; grid-template-columns: var(--left-column) minmax(0, 1fr); }
      .right { display: none; }
      .right:not(:has(> .empty)) {
        display: block;
        position: fixed;
        z-index: 8;
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: min(280px, calc(100vw - 216px));
        border: 1px solid var(--rule-solid);
      }
      .map-head { max-width: min(240px, calc(100% - 200px)); }
    }
    @media (max-width: 600px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      main {
        height: auto;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 100vh auto;
      }
      .map-shell { grid-row: 1; min-height: 520px; }
      .left { grid-row: 2; border-top: 1px solid var(--rule); border-right: 0; }
      .right:not(:has(> .empty)) { top: auto; left: 8px; width: auto; max-height: 65vh; }
      main[data-left-collapsed="true"] .left,
      main[data-right-collapsed="true"] .right {
        padding-inline: 12px;
        border-color: var(--rule);
        opacity: 1;
        overflow: auto;
        visibility: visible;
        pointer-events: auto;
      }
      #toggle-left, #toggle-right { display: none; }
      .toolbar-separator { display: none; }
      .toolbar { right: 8px; max-width: calc(100% - 16px); }
      .map-head { max-width: calc(100% - 16px); }
      .card-legend { max-width: calc(100% - 16px); }
    }

    .explore-bar { position: absolute; z-index: 6; top: 76px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
    .breadcrumbs, .view-actions, .pagination { display: flex; gap: 4px; align-items: center; pointer-events: auto; border: 2px solid var(--chrome-line); background: var(--paper-2); border-radius: 12px; padding: 4px; }
    .navigation-controls { display: flex; align-items: center; gap: 6px; max-width: 56%; min-width: 0; pointer-events: auto; }
    #back-view, #forward-view { flex: 0 0 auto; border: 2px solid var(--chrome-line); border-radius: 10px; padding: 10px; background: var(--paper-2); cursor: pointer; }
    #back-view:disabled, #forward-view:disabled { opacity: .35; cursor: default; }
    .node[data-group] { cursor: zoom-in; }
    .breadcrumbs { max-width: 100%; overflow: auto; scrollbar-width: none; }
    .breadcrumbs button, .view-actions button, .pagination button { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; white-space: nowrap; cursor: pointer; color: var(--muted); }
    .breadcrumbs button:last-child { color: var(--ink); background: var(--wash-6); }
    .breadcrumbs span { color: var(--soft); }
    button { transition: transform var(--motion-quick) var(--ease-out), background-color var(--motion-quick), color var(--motion-quick); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:focus-visible, .node:focus-visible { outline: 2px solid #c6d9ff; outline-offset: 3px; }
    .view-actions button[aria-pressed="true"] { background: #24304b; color: #c6d9ff; }
    .view-actions button:hover, .breadcrumbs button:hover, .pagination button:hover { background: var(--wash-6); color: var(--ink); }
    .pagination { position: absolute; z-index: 6; bottom: 38px; left: 50%; transform: translateX(-50%); }
    .pagination span { padding: 0 10px; color: var(--muted); font: 11px var(--mono); }
    .pagination button:disabled { opacity: .25; cursor: default; }
    .coverage-pill { font: 11px var(--mono); }
    .coverage-pill[data-quality="partial"] { color: #f6c986; }
    .map-head { top: 14px; left: 14px; background: var(--paper); }
    .map-head h1 { font-family: var(--sans); font-size: 19px; letter-spacing: -.025em; }

   if not isinstance(size, int) or not 64 <= size <= 1024: raise ValueError('Invalid canvas size')\n    config['size'] = size\n    columns = config.get('atlasColumns', 5)\n    if not isinstance(columns, int) or not 1 <= columns <= 16: raise ValueError('Invalid atlasColumns')\n    neck = config['neck']; feet = config['feet']\r\n    if any(len(p)!=2 or any(not isinstance(v,(int,float)) or not math.isfinite(v) or not 0<v<size for v in p) for p in [neck,feet]):\r\n        raise ValueError('Anchors must be inside the cell')\r\n    compiled = []; head_entries = []; expression_entries = []; body_entries = []; reports = {}; rendered = {}; keys = set()\r\n    for source in config['sources']:\r\n        key = source['name']\r\n        if not re.fullmatch(r'[a-z][a-z0-9-]*', key) or key in keys: raise ValueError('Unique sheet names required')\r\n        keys.add(key)\r\n        path = config_path.parent / source['image']; layout_path = config_path.parent / source['layout']\r\n        layout = json.loads(layout_path.read_text(encoding='utf-8'))\r\n        if layout.get('version') != 1 or layout.get('frameSemantics') != 'variants': raise ValueError('Expected reviewed variants layout')\r\n        shape = tuple(source['grid']); layout_sheet = layout['sheets']['directions']\r\n        if len(shape)!=2 or any(not isinstance(n,int) or n<1 for n in shape) or math.prod(shape)*size*size>64_000_000:\r\n            raise ValueError('Invalid sheet grid')\r\n        cells = extract(path, shape, layout_sheet)\r\n        if 'take' in source:\r\n            take = source['take']\r\n            if not take or len(set(take))!=len(take) or any(not isinstance(i,int) or i<0 or i>=len(cells) for i in take): raise ValueError('Invalid source cell selection')\r\n            cells = [cells[i] for i in take]\r\n        poses = source['poses']\r\n        if len(poses) != len(cells): raise ValueError('One pose per reviewed source box required')\r\n        scale = source['scale']\r\n        if not isinstance(scale,(int,float)) or not math.isfinite(scale) or not 0<scale<=4: raise ValueError('Invalid shared sheet scale')\r\n        layer = source['layer']\r\n        if layer not in ['head','body','expression']: raise ValueError('Expected head, body or expression layer')\r\n        measures=[]\n        for i,(cell,pose) in enumerate(zip(cells,poses)):\r\n            # Some native-alpha outputs contain faint disconnected background\r\n            # specks. Keep every edge within 12 source pixels of alpha > 16;\r\n            # remove only distant alpha <= 16 and report the exact loss.\r\n            clean = cell['image'].copy(); alpha = clean.getchannel('A')\r\n            envelope = alpha.point(lambda a: 255 if a > 16 else 0).filter(ImageFilter.MaxFilter(25))\r\n            clean_alpha = ImageChops.multiply(alpha, envelope)\r\n            removed = ImageChops.subtract(alpha, clean_alpha)\r\n            cleanup = {'pixels':sum(removed.histogram()[1:]),'maxAlpha':removed.getextrema()[1],'edgeGuard':12}\r\n            clean.putalpha(clean_alpha)\r\n            # Feet use the stable mass-band anchor from the sprite workflow.\r\n            # Detached heads use a reviewed chin/neck anchor, not body geometry.\r\n            if layer != 'body' and 'anchor' not in pose: raise ValueError(f'{key}/{i}: explicit anatomical head anchor required')\n            anchor = pose.get('anchor', cell['anchor'])\n            if len(anchor)!=2 or any(not isinstance(n,(int,float)) or not math.isfinite(n) for n in anchor):\r\n                raise ValueError('Invalid authored anchor')\r\n            if not (0<=anchor[0]<=cell['image'].width and 0<=anchor[1]<=cell['image'].height): raise ValueError('Anchor outside source cell')\r\n            target = feet if layer=='body' else neck\r\n            left,top = [target[j]-anchor[j]*scale for j in range(2)]\r\n            l,t,r,b = clean_alpha.getbbox()\r\n            if min(left+l*scale,top+t*scale,size-left-r*scale,size-top-b*scale)<2: raise ValueError(f'{key}/{i}: layer clips output')\r\n            image = clean.transform((size,size),Image.Transform.AFFINE,\r\n                (1/scale,0,-left/scale,0,1/scale,-top/scale),resample=Image.Resampling.BICUBIC)\r\n            x,y = i%shape[0]*size,i//shape[0]*size\r\n            entry = {'id':pose['id'],'sheet':key+'.png','rect':[x,y,size,size]}\r\n            if layer=='head':\r\n                gaze = pose['gaze']\r\n                if len(gaze)!=2 or any(not isinstance(n,(int,float)) or not math.isfinite(n) or abs(n)>1 for n in gaze): raise ValueError('Invalid gaze')\r\n                entry.update(kind='gaze',gaze=gaze,body=config['neutralBody']); head_entries.append(entry)\r\n            elif layer=='expression':\r\n                entry.update(kind='reaction',body=pose.get('body',config['neutralBody']),expression=True); expression_entries.append(entry)\r\n            else: body_entries.append(entry)\r\n            if entry['id'] in rendered: raise ValueError('Layer frame IDs must be globally unique')\r\n            rendered[entry['id']] = image\r\n            measures.append({'id':entry['id'],'sourceBox':cell['sourceBox'],'sourceBounds':cell['bounds'],'sourceAnchor':anchor,'targetAnchor':target,'scale':scale,'outputBounds':image.getchannel('A').getbbox(),'distantAlphaCleanup':cleanup})\n        reports[key] = {'sourceSha256':digest(path),'sourceSize':layout_sheet['sourceSize'],'layoutSha256':digest(layout_path),'frames':measures}\n    if len({tuple(f['gaze']) for f in head_entries}) != len(head_entries): raise ValueError('Duplicate gaze coordinates')\r\n    neutral = next(f for f in head_entries if f['gaze']==[0,0])\r\n    if config['neutralBody'] not in {f['id'] for f in body_entries}: raise ValueError('Neutral body missing')\r\n    master_report, master_preview = verify_master(config_path, config, rendered, neutral['id'], reports)\n    head_entries.sort(key=lambda f:(f['gaze'][1],f['gaze'][0]))\n    # Pack by rendered layer, independent of source-sheet layout.\r\n    compiled = []\r\n    for name,entries in [('heads',head_entries),('expressions',expression_entries),('bodies',body_entries)]:\r\n        if not entries: continue\r\n        cols = min(columns,len(entries)); rows=math.ceil(len(entries)/cols)\n        if not isinstance(cols,int) or cols<1 or cols>16 or cols*rows*size*size>64_000_000: raise ValueError('Invalid packed atlas geometry')\r\n        atlas=Image.new('RGBA',(cols*size,rows*size))\r\n        for i,entry in enumerate(entries):\r\n            x,y=i%cols*size,i//cols*size; atlas.alpha_composite(rendered[entry['id']],(x,y))\r\n            entry.update(sheet=name+'.png',rect=[x,y,size,size])\r\n        compiled.append((name,atlas))\r\n    frames = head_entries[:] + expression_entries\r\n    if any(f['body'] not in {b['id'] for b in body_entries} for f in expression_entries): raise ValueError('Unknown expression body')\r\n    for reaction in config.get('reactions',[]):\r\n        if reaction['body'] not in {f['id'] for f in body_entries}: raise ValueError('Unknown reaction body')\r\n        head = next(f for f in head_entries if f['id']==reaction.get('head',neutral['id']))\r\n        frames.append({**head,'id':reaction['id'],'kind':'reaction','body':reaction['body']})\r\n        del frames[-1]['gaze']\r\n    if len({f['id'] for f in frames})!=len(frames): raise ValueError('Duplicate pose IDs')\r\n    manifest = {'version':1,'name':config['name'],'neutral':neutral['id'],'pivot':[n/size for n in feet],\r\n        'layers':{'size':size,'neck':[n/size for n in neck],'bodyFrames':body_entries},'frames':frames}\r\n    output.mkdir(parents=True)\r\n    master_preview.save(output/'master-review.png')\r\n    for key,atlas in compiled: atlas.save(output/(key+'.png'),optimize=True)\r\n    (output/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n',encoding='utf-8')\r\n    (output/'build-report.json').write_text(json.dumps({'configSha256':digest(config_path),'sources':reports,'master':master_report},indent=2)+'\\n',encoding='utf-8')\r\n    # Spatial contact proof is separate from the two independently rendered layers.\r\n    ordered=sorted(head_entries,key=lambda f:(f['gaze'][1],f['gaze'][0]))\r\n    cols=len({f['gaze'][0] for f in ordered}); rows=math.ceil(len(ordered)/cols)\r\n    contact=Image.new('RGBA',(cols*size,rows*(size+20)),'#eeeae2'); draw=ImageDraw.Draw(contact)\r\n    for i,f in enumerate(ordered):\r\n        image=rendered[f['body']].copy(); image.alpha_composite(rendered[f['id']])\r\n        x,y=i%cols*size,i//cols*(size+20);contact.alpha_composite(image,(x,y));draw.text((x+6,y+size+2),str(f['gaze']),fill='#333333')\r\n    contact.convert('RGB').save(output/'layer-contact.png')\n    reactions = [f for f in frames if f['kind']=='reaction']\n    if reactions:\n        tile=256; cols=6\n        contact=Image.new('RGBA',(cols*tile,math.ceil(len(reactions)/cols)*(tile+20)),'#c9b4aa'); draw=ImageDraw.Draw(contact)\n        for i,f in enumerate(reactions):\n            image=rendered[f['body']].copy()\n            head_id=f['id'] if f.get('expression') else next(r.get('head',neutral['id']) for r in config['reactions'] if r['id']==f['id'])\n            image.alpha_composite(rendered[head_id])\n            x,y=i%cols*tile,i//cols*(tile+20)\n            contact.alpha_composite(image.resize((tile,tile),Image.Resampling.LANCZOS),(x,y));draw.text((x+6,y+tile+2),f['id'],fill='#302b33')\n        contact.convert('RGB').save(output/'reaction-contact.png')\n    print(f'Built {len(head_entries)} head poses, {len(expression_entries)} expressions and {len(body_entries)} body frames: {output.resolve()}')","start_line":13,"end_line":133,"extractor":"python-ast","source_digest":"ed87e4188bb6688fd46a9f1b448de41800affe16bf1cd3222705c8159650e818","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_o  + (cell - (r-l)) // 2\n        y = index // columns * cell_height + ((cell_height - (b-t)) // 2 if columns != count else t)\n        result[y:y+b-t,x:x+r-l] = sprite\n    if int(result[:,:,3].sum()) != int(alpha.sum()):\n        raise ValueError('Pixel ownership failed; original source was preserved')\n    Image.fromarray(result).save(output)\n    print(f'Isolated {count} sprites without scaling: {Path(output).resolve()}')","start_line":9,"end_line":46,"extractor":"python-ast","source_digest":"a7a3e62a3308948d39980d4eebed11fe3507cc5053a863d1e2f4652fa0c1b0db","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_only":false},{"id":"external:python:numpy","type":"calls","type_only":false},{"id":"external:python:numpy","type":"imports","type_only":false},{"id":"external:python:pathlib","type":"calls","type_only":false},{"id":"external:python:pathlib","type":"imports","type_only":false},{"id":"external:python:scipy","type":"calls","type_only":false},{"id":"external:python:scipy","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"SKILLS/page-pet/scripts/level_colors.py","path":"SKILLS/page-pet/scripts/level_colors.py","label":"level_colors.py","type":"module","boundary":"Builders","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["bound_image","correct","digest","run","sample","to_lab","to_linear","to_rgb","verify_reports"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/page-pet/scripts/level_colors.py","symbol":"def digest(path):\n    return hashlib.sha256(path.read_bytes()).hexdigest()","start_line":16,"end_line":17,"extractor":"python-ast","source_digest":"c772a78c6b23d6ca991966d52f350b99d224458a5fdabc7c4fb9bb0dd331d516","kind":"definition"},{"path":"SKILLS/page-pet/scripts/level_colors.py","symbol":"de pts/verify_master.py","symbol":"def verify_master(config_path, config, rendered, neutral, reports):\n    spec = config['master']; root = config_path.parent; size = config['size']\n    path = root / spec['image']; layout_path = root / spec['layout']\n    layout = json.loads(layout_path.read_text(encoding='utf-8'))['sheets']['directions']\n    cells = extract(path, tuple(layout['grid']), layout)\n    if not isinstance(spec['index'], int) or not 0 <= spec['index'] < len(cells): raise ValueError('Invalid master cell index')\n    cell = cells[spec['index']]\n    scale = spec['scale']; ax, ay = spec['anchor']; tx, ty = config['feet']\n    if not 0 < scale <= 4 or not 0 <= ax <= cell['image'].width or not 0 <= ay <= cell['image'].height:\n        raise ValueError('Invalid master scale or anchor')\n    sha = digest(path)\n    for ident in [neutral, config['neutralBody']]:\n        source = next(r for r in reports.values() if any(f['id']==ident for f in r['frames']))\n        if source['sourceSha256'] != sha:\n            raise ValueError('Neutral head and body must come from the same master sheet as the complete character')\n    full = cell['image'].transform((size,size), Image.Transform.AFFINE,\n        (1/scale,0,ax-tx/scale,0,1/scale,ay-ty/scale),resample=Image.Resampling.BICUBIC)\n    body = rendered[config['neutralBody']]; head = rendered[neutral]\n    composite = body.copy(); composite.alpha_composite(head)\n    a = full.getchannel('A').point(lambda v:255 if v>128 else 0)\n    b = composite.getchannel('A').point(lambda v:255 if v>128 else 0)\n    intersection = sum(ImageChops.multiply(a,b).histogram()[1:])\n    union = sum(ImageChops.lighter(a,b).histogram()[1:])\n    iou = intersection / max(1,union)\n    fb, cb = a.getbbox(), b.getbbox()\n    if not fb or not cb: raise ValueError('Empty master or neutral reconstruction')\n    bounds_drift = max(abs(x-y) for x,y in zip(fb,cb)) / size\n    nx,ny = map(round,config['neck'])\n    connected = head.getpixel((nx,ny))[3]>128 and body.getpixel((nx,ny))[3]>128\n    drift = []\n    # Horizontal silhouette width detects scale drift without fitting each frame.\n    reference_width = head.getchannel('A').point(lambda v:255 if v>128 else 0).getbbox()\n    reference_width = reference_width[2]-reference_width[0]\n    body_width = body_metrics(body)['bodyWidth']\n    body_ids = {pose['id'] for source in config['sources'] if source['layer']=='body' for pose in source['poses']}\n    detached = [ident for ident,image in rendered.items() if image.getpixel((nx,ny))[3]<=128]\n    for ident,image in rendered.items():\n        if ident in body_ids:\n            ratio = body_metrics(image)['bodyWidth']/body_width\n        else:\n            bounds=image.getchannel('A').point(lambda v:255 if v>128 else 0).getbbox()\n            ratio=(bounds[2]-bounds[0])/reference_width\n        drift.append({'id':ident,'widthRatio':round(ratio,4)})\n    report={'sourceSha256':sha,'layoutSha256':digest(layout_path),'silhouetteIoU':round(iou,5),\n        'boundsDriftFraction':round(bounds_drift,5),'neckOverlap':connected,'detachedLayers':detached,'proportions':drift,\n        'limits':{'minimumIoU':.93,'maximumBoundsDriftFraction':.025,'maximumWidthDrift':.12}}\n    preview=Image.new('RGBA',(size*3,size+30),'#d1c3b6'); draw=ImageDraw.Draw(preview)\n    for i,(label,image) in enumerate([('Complete master',full),('Registered layers',composite),('50% overlay',Image.blend(full,composite,.5))]):\n        preview.alpha_composite(image,(i*size,0)); draw.text((i*size+10,size+8),label,fill='#302b33')\n    # Keep failed evidence beside sources, never publish a rejected live pack.\n    preview.convert('RGB').save(root/'master-review-latest.png')\n    (root/'master-review-latest.json').write_text(json.dumps(report,indent=2)+'\\n',encoding='utf-8')\n    if iou<.93 or bounds_drift>.025 or not connected:\n        raise ValueError(f'Master reconstruction failed: IoU={iou:.3f}, bounds drift={bounds_drift:.3f}, neck overlap={connected}; i take = source['take']\r\n            if not take or len(set(take))!=len(take) or any(not isinstance(i,int) or i<0 or i>=len(cells) for i in take): raise ValueError('Invalid source cell selection')\r\n            cells = [cells[i] for i in take]\r\n        poses = source['poses']\r\n        if len(poses) != len(cells): raise ValueError('One pose per reviewed source box required')\r\n        scale = source['scale']\r\n        if not isinstance(scale,(int,float)) or not math.isfinite(scale) or not 0<scale<=4: raise ValueError('Invalid shared sheet scale')\r\n        layer = source['layer']\r\n        if layer not in ['head','body','expression']: raise ValueError('Expected head, body or expression layer')\r\n        measures=[]\n        for i,(cell,pose) in enumerate(zip(cells,poses)):\r\n            # Some native-alpha outputs contain faint disconnected background\r\n            # specks. Keep every edge within 12 source pixels of alpha > 16;\r\n            # remove only distant alpha <= 16 and report the exact loss.\r\n            clean = cell['image'].copy(); alpha = clean.getchannel('A')\r\n            envelope = alpha.point(lambda a: 255 if a > 16 else 0).filter(ImageFilter.MaxFilter(25))\r\n            clean_alpha = ImageChops.multiply(alpha, envelope)\r\n            removed = ImageChops.subtract(alpha, clean_alpha)\r\n            cleanup = {'pixels':sum(removed.histogram()[1:]),'maxAlpha':removed.getextrema()[1],'edgeGuard':12}\r\n            clean.putalpha(clean_alpha)\r\n            # Feet use the stable mass-band anchor from the sprite workflow.\r\n            # Detached heads use a reviewed chin/neck anchor, not body geometry.\r\n            if layer != 'body' and 'anchor' not in pose: raise ValueError(f'{key}/{i}: explicit anatomical head anchor required')\n            anchor = pose.get('anchor', cell['anchor'])\n            if len(anchor)!=2 or any(not isinstance(n,(int,float)) or not math.isfinite(n) for n in anchor):\r\n                raise ValueError('I uplicate gaze coordinates')\r\n    neutral = next(f for f in head_entries if f['gaze']==[0,0])\r\n    if config['neutralBody'] not in {f['id'] for f in body_entries}: raise ValueError('Neutral body missing')\r\n    master_report, master_preview = verify_master(config_path, config, rendered, neutral['id'], reports)\n    head_entries.sort(key=lambda f:(f['gaze'][1],f['gaze'][0]))\n    # Pack by rendered layer, independent of source-sheet layout.\r\n    compiled = []\r\n    for name,entries in [('heads',head_entries),('expressions',expression_entries),('bodies',body_entries)]:\r\n        if not entries: continue\r\n        cols = min(columns,len(entries)); rows=math.ceil(len(entries)/cols)\n        if not isinstance(cols,int) or cols<1 or cols>16 or cols*rows*size*size>64_000_000: raise ValueError('Invalid packed atlas geometry')\r\n        atlas=Image.new('RGBA',(cols*size,rows*size))\r\n        for i,entry in enumerate(entries):\r\n            x,y=i%cols*size,i//cols*size; atlas.alpha_composite(rendered[entry['id']],(x,y))\r\n            entry.update(sheet=name+'.png',rect=[x,y,size,size])\r\n        compiled.append((name,atlas))\r\n    frames = head_entries[:] + expression_entries\r\n    if any(f['body'] not in {b['id'] for b in body_entries} for f in expression_entries): raise ValueError('Unknown expression body')\r\n    for reaction in config.get('reactions',[]):\r\n        if reaction['body'] not in {f['id'] for f in body_entries}: raise ValueError('Unknown reaction body')\r\n        head = next(f for f in head_entries if f['id']==reaction.get('head',neutral['id']))\r\n        frames.append({**head,'id':reaction['id'],'kind':'reaction','body':reaction['body']})\r\n        del frames[-1]['gaze']\r\n    if len({f['id'] for f in frames})!=len(frames): raise ValueError('Duplicate pose IDs')\r\n    manifest = {'version':1,'name':config['name'],'neutral':neutral['id'],'pivot':[n/size for n in feet],\r\n        'layers':{'size':size,'neck':[n/size for n in neck],'bodyFrames':body_entries},'frames':frames}\r\n    output.mkdir(parents=True)\r\n    master_preview.save(output/'master-review.png')\r\n    for key,atlas in compiled: atlas.save(output/(key+'.png'),optimize=True)\r\n    (output/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n',encoding='utf-8')\r\n    (output/'build-report.json').write_text(json.dumps({'configSha256':digest(config_path),'sources':reports,'master':master_report},indent=2)+'\\n',encoding='utf-8')\r\n    # Spatial contact proof is separate from the two independently rendered layers.\r\n    ordered=sorted(head_entries,key=lambda f:(f['gaze'][1],f['gaze'][0]))\r\n    cols=len({f['gaze'][0] for f in ordered}); rows=math.ceil(len(ordered)/cols)\r\n    contact=Image.new('RGBA',(cols*size,rows*(size+20)),'#eeeae2'); draw=ImageDraw.Draw(contact)\r\n    for i,f in enumerate(ordered):\r\n        image=rendered[f['body']].copy(); image.alpha_composite(rendered[f['id']])\r\n        x,y=i%cols*size,i//cols*(size+20);contact.alpha_composite(image,(x,y));draw.text((x+6,y+size+2),str(f['gaze']),fill='#333333')\r\n    contact.convert('RGB').save(output/'layer-contact.png')\n    reactions = [f for f in frames if f['kind']=='reaction']\n    if reactions:\n        tile=256; cols=6\n        contact=Image.new('RGBA',(cols*tile,math.ceil(len(reactions)/cols)*(tile+20)),'#c9b4aa'); draw=ImageDraw.Draw(contact)\n        for i,f in enumerate(reactions):\n            image=rendered[f['body']].copy()\n            head_id=f['id'] if f.get('expression') else next(r.get('head',neutral['id']) for r in config['reactions'] if r['id']==f['id'])\n            image.alpha_composite(rendered[head_id])\n            x,y=i%cols*tile,i//cols*(tile+20)\n            contact.alpha_composite(image.resize((tile,tile),Image.Resampling.LANCZOS),(x,y));draw.text((x+6,y+tile+2),f['id'],fill='#302b33')\n        contact.convert('RGB').save(output/'reaction-contact.png')\n    print(f'Built {len(head_entries)} head poses, {len(expression_entries)} e \r\n        raise ValueError('Empty sprite')\r\n    l, t, r, b = bounds\r\n    y0, y1 = t + round((b-t)*.82), t + round((b-t)*.96)\r\n    p = alpha.load()\r\n    mass = [sum(p[x,y] for y in range(y0,y1) if p[x,y]>16) for x in range(cell.width)]\r\n    total = sum(mass)\r\n    if not total:\r\n        raise ValueError('No stable lower-body band')\r\n    center = sum((x+.5)*v for x,v in enumerate(mass))/total\r\n    cumulative = 0\r\n    low = None\r\n    for x, weight in enumerate(mass):\r\n        cumulative += weight\r\n        if low is None and cumulative >= total*.05:\r\n            low = x\r\n        if cumulative >= total*.95:\r\n            high = x+1\r\n            break\r\n    return {'bounds':list(bounds),'anchor':[center,b],'bodyWidth':high-low}","start_line":13,"end_line":35,"extractor":"python-ast","source_digest":"957272f43e5bea7a79d1bc88c65d2e2b999a6a81f7579ad5031a3083dd987b24","kind":"definition"},{"path":"SKILLS/page-pet/scripts/build_pack.py","symbol":"def head_width(cell, bounds):\r\n    \"\"\"Median central head silhouette, excluding hands and transparent fringe.\"\"\"\r\n    l,t,r,b=bounds\r\n    alpha=cell.getchannel('A').load()\r\n    center=(l+r)//2\r\n    widths=[]\r\n    for y in range(t+round((b-t)*.03),t+round((b-t)*.35)):\r\n        x=next((candidate for distance in range(max(2,cell.width//5)+1)\r\n            for candidate in (center-distance,center+distance)\r\n            if 0<=candidate<cell.width and alpha[candidate,y]>16),None)\r\n        if x is None: continue\r\n        left=right=x\r\n        while left>0 and alpha[left-1,y]>16: left-=1\r\n        while right+1<cell.width and alpha[right+1,y]>16: right+=1\r\n        widths.append(right-left+1)\r\n    if not widths: raise ValueError('No stable head silhouette; review source art')\r\n    return statistics.median(widths)","start_line":38,"end_line":54,"extractor":"python-ast","source_digest":"957272f43e5bea7a79d1bc88c65d2e2b999a6a81f7579ad5031a3083dd987b24","kind":"definition"},{"path":"SKILLS/page-pet/scripts/build_pack.py","symbol":"def extract(source, shape, layout, measure_head=True):\r\n    image = Image.open(source).convert('RGBA')\r\n    if layout['sourceSha256'] != digest(source) or layout['sourceSize'] != list(image.size):\r\n        raise ValueError(f'{source.name}: source changed since layout inspection')\r\n    boxes = layout['boxes']\r\n    if layout['grid'] != list(shape) or len(boxes) != math.prod(shape):\r\n        raise ValueError('Layout grid/count mismatch')\r\n    ownership = Image.new('1',image.size)\r\n    draw = ImageDraw.Draw(ownership)\r\n    frames = []\r\n    for index, box in enumerate(boxes):\r\n        if len(box)!=4 or any(not isinstance(n,int) for n in box):\r\n            raise ValueError('Source boxes must be integer [left,top,right,bottom]')\r\n        l,t,r,b = box\r\n        if not (0<=l<r<=image.width and 0<=t<b<=image.height):\r\n            raise ValueError(f'Source box {index} is out of bounds')\r\n        if ownership.crop(box).getbbox():\r\n            raise ValueError(f'Source box {index} overlaps another box')\r\n        draw.rectangle((l,t,r-1,b-1),fill=1)\r\n        cell = image.crop(box)\r\n        if cell.getchannel('A').histogram()[0]/(cell.width*cell.height)<.08:\r\n            raise ValueError(f'{source.name} frame {index}: missing transparent background')\r\n        metrics = body_metrics(cell)\r\n        metrics['headWidth'] = head_width(cell,metrics['bounds']) if measure_head else None\r\n        metrics['measurementAnchor'] = metrics['anchor'][:]\r\n        bounds = metrics['bounds']\r\n        if bounds[0]==0 or bounds[1]==0 or bounds[2]==cell.width or bounds[3]==cell.height:\r\n            raise ValueError(f'{source.name} frame {index}: silhouette touches source box; inspect clipping')\r\n        override = layout.get('anchors',{}).get(str(index))\r\n        if override is not None:\r\n            if (not isinstance(override,list) or len(override)!=2\r\n                or any(not isinstance(n,(float,int)) or not math.isfinite(n) for n in override)\r\n                or not (0<=override[0]<=cell.width and 0<=override[1]<=cell.height)):\r\n                raise ValueError(f'Frame {index}: invalid explicit anchor')\r\n            metrics['anchor']=override\r\n        frames.append({'image':cell,'sourceBox':box,**metrics})\r\n    uncovered = image.getchannel('A').copy()\r\n    uncovered.paste(0,mask=ownership)\r\n    if uncovered.getbbox():\r\n        raise ValueError('Layout leaves alpha pixels unassigned')\r\n    return frames","start_line":57,"end_line":97,"extractor":"python-ast","source_digest":"957272f43e5bea7a79d1bc88c65d2e2b999a6a81f7579ad5031a3083dd987b24","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_only":false},{"id":"external:python:json","type":"calls","type_only":false},{"id":"external:python:json","type":"imports","type_only":false},{"id":"external:python:level_colors","type":"imports","type_only":false},{"id":"external:python:math","type":"calls","type_only":false},{"id":"external:python:math","type":"imports","type_only":false},{"id":"external:python:pathlib","type":"imports","type_only":false},{"id":"external:python:prepare_layout","type":"calls","type_only":false},{"id":"external:python:prepare_layout","type":"imports","type_only":false},{"id":"external:python:re","type":"calls","type_only":false},{"id":"external:python:re","type":"imports","type_only":false},{"id":"external:python:review_gaze","type":"calls","type_only":false},{"id":"external:python:review_gaze","type":"imports","type_only":false},{"id":"external:python:statistics","type":"calls","type_only":false},{"id":"external:python:statistics","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"SKILLS/page-pet/scripts/check_color_leveling.py","path":"SKILLS/page al:python:pathlib","type":"imports","type_only":false},{"id":"external:python:tempfile","type":"calls","type_only":false},{"id":"external:python:tempfile","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"SKILLS/page-pet/scripts/isolate_strip.py","path":"SKILLS/page-pet/scripts/isolate_strip.py","label":"isolate_strip.py","type":"interface","boundary":"Builders","entrypoints":["SKILLS/page-pet/scripts/isolate_strip.py:isolate"],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["isolate"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/page-pet/scripts/isolate_strip.py","symbol":"def isolate(source, output, count=5, columns=None):\n    rgba = np.array(Image.open(source).convert('RGBA'))\n    alpha = rgba[:, :, 3]\n    components, total = label(alpha > 16)\n    sizes = np.bincount(components.ravel())\n    sizes[0] = 0\n    ranked = np.argsort(sizes)[-count:]\n    if total < count or any(sizes[i] < alpha.size * (.125 / count) for i in ranked):\n        raise ValueError('Expected distinct full-character components; review source manually')\n    columns = columns or count\n    if count % columns:\n        raise ValueError('Component count must divide into complete rows')\n    if columns == count:\n        ranked = sorted(ranked, key=lambda i: np.where(components == i)[1].mean())\n    else:\n        by_row = sorted(ranked, key=lambda i: np.where(components == i)[0].mean())\n        ranked = [i for start in range(0,count,columns)\n                  for i in sorted(by_row[start:start+columns], key=lambda j: np.where(components == j)[1].mean())]\n    major = np.isin(components, ranked)\n    nearest = distance_transform_edt(~major, return_distances=False, return_indices=True)\n    owners = components[tuple(nearest)]\n    boxes = []\n    for component in ranked:\n        ys, xs = np.where((owners == component) & (alpha > 0))\n        boxes.append((int(xs.min()), int(ys.min()), int(xs.max()) + 1, int(ys.max()) + 1))\n    cell = max(r-l for l, _, r, _ in boxes) + 48\n    cell_height = max(b-t for _,t,_,b in boxes) + 48 if columns != count else rgba.shape[0]\n    result = np.zeros((cell_height * (count // columns), cell * columns, 4), dtype=np.uint8)\n    for index, (component, (l,t,r,b)) in enumerate(zip(ranked, boxes)):\n        sprite = rgba[t:b,l:r].copy()\n        sprite[owners[t:b,l:r] != component] = 0\n        x = index % columns * cell + (cell - (r-l)) // 2\n        y = index // columns * cell_height + ((cell_height - (b-t)) // 2 if columns != count else t)\n        result[y:y+b-t,x:x+r-l] = sprite\n    if int(result[:,:,3].sum()) != int(alpha.sum()):\n        raise ValueError('Pixel ownership failed; original source was preserved')\n    Image.fromarray(result).save(output)\n    print(f'Isolated {count} sprites without scaling: {Path(output).resolve()}')","start_line":9,"end_line":46,"extractor":"python-ast","source_digest":"a7a3e62a3308948d39980d4eebed11fe3507cc5053a863d1e2f4652fa0c1b0db","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_only":false},{"id":"external:python:numpy","type":"calls","type_only":false},{"id":"external:python:numpy","type":"imports","type_only":false},{"id":"external:python:pathlib","type":"calls","type_only":false},{"id":"external:python:pathlib","type":"imports","type_only":false},{"id":"external:python:scipy","type":"calls","type_only":false},{"id":"external:python:scipy","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"SKILLS/page-pet/scripts/level_colors.py","path":"SKILLS/page-pet/scripts/level_colors.py","label":"level_colors.py","type":"module","boundary":"Builders","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["bound_image","correct","digest","run","sample","to_lab e_source.py","label":"prepare_four_pose_source.py","type":"interface","boundary":"Builders","entrypoints":["SKILLS/page-pet/scripts/prepare_four_pose_source.py:main"],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["main"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/page-pet/scripts/prepare_four_pose_source.py","symbol":"def main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument('--source', type=Path, required=True)\n    parser.add_argument('--reference', type=Path, required=True)\n    parser.add_argument('--out', type=Path, required=True)\n    parser.add_argument('--neutral', type=Path, help='Reviewed replacement front pose when generated neutral is not front-facing')\n    parser.add_argument('--left-cell', type=int, choices=(0, 1, 2), default=1)\n    parser.add_argument('--right-cell', type=int, choices=(0, 1, 2), default=2)\n    args = parser.parse_args()\n    if args.left_cell == args.right_cell:\n        parser.error('Left and right must use distinct source cells')\n    if not args.neutral and 0 in (args.left_cell, args.right_cell):\n        parser.error('Cell 0 is the neutral pose unless --neutral replaces it')\n    if args.out.exists():\n        parser.error('Output exists; choose a new source directory')\n    image = Image.open(args.source).convert('RGBA')\n    if image.getchannel('A').getextrema()[0] != 0:\n        parser.error('Source has no transparent alpha')\n    try:\n        xs = cuts(image, 2, 'x')\n        cells = [None] * 4\n        boxes = [None] * 4\n        for column in range(2):\n            ys = cuts(image.crop((xs[column], 0, xs[column + 1], image.height)), 2, 'y')\n            for row in range(2):\n                index = row * 2 + column\n                box = (xs[column], ys[row], xs[column + 1], ys[row + 1])\n                boxes[index] = list(box)\n                cells[index] = image.crop(box)\n        if any(cell.getchannel('A').getbbox() is None for cell in cells):\n            raise ValueError('One pilot cell is empty')\n    except ValueError as exc:\n        parser.error(str(exc))\n    if args.neutral:\n        new_neutral = Image.open(args.neutral).convert('RGBA')\n        bounds = new_neutral.getchannel('A').point(lambda a: 255 if a > 16 else 0).getbbox()\n        if not bounds:\n            parser.error('Replacement neutral is empty')\n        new_neutral = new_neutral.crop(bounds)\n        heights = []\n        for index in (args.left_cell, args.right_cell):\n            l, t, r, b = cells[index].getchannel('A').point(lambda a: 255 if a > 16 else 0).getbbox()\n            heights.append(b - t)\n        target_height = round(sum(heights) / len(heights))\n        new_neutral = new_neutral.resize((round(new_neutral.width * target_height / new_neutral.height), target_height), Image.Resampling.LANCZOS)\n        cells[0] = new_neutral\n    width = max(cell.width for cell in cells) + 48\n    height = max(cell.height for cell in cells) + 48\n    directions = Image.new('RGBA', (width * 3, height))\n    reaction = Image.new('RGBA', (width, height))\n    for column, index in enumerate((args.left_cell, 0, args.right_cell)):\n        cell = cells[index]\n        directions.alpha_composite(cell, (column * width + (width - cell.width) // 2, (height - cell.height) // 2))\n    cell = cells[3]\n    reaction.alpha_composite(cell, ((width - cell.width) // 2, (height - cell.height) // 2))\n    args.out.mkdir(parents=True)\n    directions.save(args.out / 'directions.png')\n    reaction.save(args.out / 'reactions.png')\n    (args.out / 'source.json').write_text(json.dumps({\n        'reference': os.path.relpath(args.reference, args.out), 'referenceSha256': digest(args.reference),\n        'generatedSource': os.path.relpath(args.source, args.out), 'generatedSourceSha256': digest(args.source),\n        'generatedSourceSize': list(image.size), 'sourceBoxes': boxes,\n        'directionSourceCells': [args.left_cell, 'replacement' if args.neutral else 0, args.right_cell],\n        'replacementNeutral': os.path.relpath(args.neutral, args.out) if args.neutral else None,\n        'replacementNeutralSha256': digest(args.neutral) if args.neutral else None,\n        'reactionSourceCells': [3],\n        'directionsSha256': digest(args.out / 'directions.png'),\n        'reactionsSha256': digest(args.out / 'reactions.png'),\n    }, indent=2) + '\\n', encoding='utf-8')\n    print(f'Prepared 3 gaze poses and 1 reaction: {args.out.resolve()}')","start_line":14,"end_line":83,"extractor":"python-ast","source_digest":"e4d370828707bf9c60fe892c49b9ae67aa52b85395d17650ebeef61f336cd64c","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_only":false},{"id":"external:python:json","type":"calls","type_only":false},{"id":"external:python:json","type":"imports","type_only":false},{"id":"external:python:os","type":"imports","type_only":false},{"id":"external:python:pathlib","type":"imports","type_only":false},{"id":"external:python:prepare_layout","type":"calls","type_only":false},{"id":"external:python:prepare_layout","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"SKILLS/page-pet/scripts/prepare_layout.py","path":"SKILLS/page-pet/scripts/prepare_layout.py","label":"prepare_layout.py","type":"module","boundary":"Builders","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["cuts","digest","grid","inspect"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/page-pet/scripts/prepare_layout.py","symbol":"def digest(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()","start_line":9,"end_line":10,"extractor":"python-ast","source_digest":"564244824ec601512531c9d02184bba2984023c495704a2c37909c87ed2218f1","kind":"definition"},{"path":"SKILLS/page-pet/scripts/prepare_layout.py","symbol":"def grid(value):\n    try:\n        cols, rows = map(int, value.lower().split('x'))\n        if not (1 <= cols <= 64 and 1 <= rows <= 64):\n            raise ValueError()\n        return cols, rows\n    except ValueError:\n        raise argparse.ArgumentTypeError('Use columns x rows, each from 1 to 64')","start_line":13,"end_line":20,"extractor":"python-ast","source_digest":"564244824ec601512531c9d02184bba2984023c495704a2c37909c87ed2218f1","kind":"definition"},{"path":"SKILLS/page-pet/scripts/prepare_layout.py","symbol":"def cuts(image, count, axis):\n    alpha = image.getchannel(\"A\")\n    w, h = image.size\n    p = alpha.load()\n    profile = ([sum(p[x, y] for y in range(h) if p[x, y] > 16) for x in range(w)] if axis == \"x\"\n               else [sum(p[x, y] for x in range(w) if p[x, y] > 16) for y in range(h)])\n    length = len(profile)\n    boundaries = [0]\n    for index in range(1, count):\n        ideal, radius = index * length / count, length / count * .35\n        candidates = [v for v in range(max(boundaries[-1] + 1, int(ideal - radius)), min(length, int(ideal + radius))) if profile[v] == 0]\n        if not candidates:\n            raise ValueError(f\"No clear alpha gutter on {axis} near slot {index}; author source boxes or repair source. No grid fallback.\")\n        runs = []\n        for v in candidates:\n            if not runs or v > runs[-1][-1] + 1:\n                runs.append([v])\n            else:\n                runs[-1].append(v)\n        run = min(runs, key=lambda group: abs((group[0] + group[-1]) / 2 - ideal))\n        boundaries.append((run[0] + run[-1]) // 2)\n    return [*boundaries, length]","start_line":23,"end_line":44,"extractor":"python-ast","source_digest":"564244824ec601512531c9d02184bba2984023c495704a2c37909c87ed2218f1","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","typ 2b33')\n    # Keep failed evidence beside sources, never publish a rejected live pack.\n    preview.convert('RGB').save(root/'master-review-latest.png')\n    (root/'master-review-latest.json').write_text(json.dumps(report,indent=2)+'\\n',encoding='utf-8')\n    if iou<.93 or bounds_drift>.025 or not connected:\n        raise ValueError(f'Master reconstruction failed: IoU={iou:.3f}, bounds drift={bounds_drift:.3f}, neck overlap={connected}; inspect master-review-latest.png')\n    bad=[m['id'] for m in drift if abs(m['widthRatio']-1)>.12]\n    if bad: raise ValueError(f'Proportion drift beyond 12%: {bad}; repair source/registration, do not resize individual frames')\n    if detached: raise ValueError(f'Layers miss the neck docking point: {detached}')\n    return report, preview.convert('RGB')","start_line":8,"end_line":65,"extractor":"python-ast","source_digest":"42d3d420d77c59f58290fbf34f53153c5bfca262051e4c3c0f677aefa49958d8","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:build_pack","type":"calls","type_only":false},{"id":"external:python:build_pack","type":"imports","type_only":false},{"id":"external:python:json","type":"calls","type_only":false},{"id":"external:python:json","type":"imports","type_only":false},{"id":"external:python:prepare_layout","type":"calls","type_only":false},{"id":"external:python:prepare_layout","type":"imports","type_only":false}],"parent":"SKILLS/page-pet/scripts"},{"id":"external:javascript:node:child_process","path":"external:javascript:node:child_process","label":"node:child_process","type":"external","boundary":"External","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"reference-only","is_test":false,"symbols":[],"evidence":{"status":"verified","locations":[{"path":"scripts/validate-skill-pack.mjs","symbol":"import { spawnSync } from \"node:child_process\";","start_line":1,"end_line":1,"extractor":"tree-sitter-javascript","source_digest":         sceneAnimations.forEach(animation => animation.cancel());
        sceneAnimations = [];
        outgoingScene?.remove();
        outgoingScene = null;
      }

      function leaveScene() {
        const layer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const copy = viewport.cloneNode(true);
        for (const element of [copy, ...copy.querySelectorAll("*")]) {
          element.removeAttribute("id");
          element.removeAttribute("data-node-id");
          element.removeAttribute("data-group");
          element.removeAttribute("tabindex");
        }
        layer.setAttribute("aria-hidden", "true");
        layer.style.pointerEvents = "none";
        layer.dataset.scene = "outgoing";
        layer.append(copy);
        scene.before(layer);
        return layer;
      }

      function animateScene(direction) {
        const origin = `${svg.clientWidth / 2}px ${svg.clientHeight / 2}px`;
        scene.style.transformOrigin = outgoingScene.style.transformOrigin = origin;
        const options = { duration: MOTION.camera, easing: MOTION.ease };
        const outgoing = outgoingScene.animate([
          { opacity: 1, transform: "scale(1)" },
          { opacity: 0, transform: `scale(${direction > 0 ? 1.16 : .86})` }
        ], { ...options, fill: "forwards" });
        const incoming = scene.animate([
          { opacity: 0, transform: `scale(${direction > 0 ? .86 : 1.16})` },
          { opacity: 1, transform: "scale(1)" }
        ], options);
        sceneAnimations = [outgoing, incoming];
        incoming.onfinish = finishSceneTransition;
      }

      const GRID = 4;

      const BOUNDARY_HUES = [210, 268, 328, 12, 28, 48, 196, 248, 302, 356, 38, 222, 278, 18, 145, 125, 90];
      const STATES = [

      function cardPlatePath(width = NODE_W, height = NODE_H) {

        return [

          `H ${width - tr}`,
          `A ${tr} ${tr} 0 0 1 ${width} ${tr}`,
          `V ${height - br}`,
          `A ${br} ${br} 0 0 1 ${width - br} ${height}`,

          `A ${bl} ${bl} 0 0 1 0 ${height - bl}`,

      function fitText(value, probe, maxWidth) {
        probe.textContent = value;
        if (probe.getComputedTextLength() <= maxWidth) return value;
        let low = 0;
        let high = value.length;
        let best = "\u2026";
        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          const next = `${value.slice(0, Math.max(1, mid))}\u2026`;
          probe.textContent = next;
          if (probe.getComputedTextLength() <= maxWidth) {
            best = next;
            low = mid + 1;
          } else high = mid - 1;
        }
        return best;
      }

      function groupColor(boundary) {

      }

      function applyBoundaryStyle(element, boundary) {

      function projectView(animate = false, restored = null, direction = 0) {
        stopViewAnimation();

        const transition = animate && !reduceMotion.matches && viewport.childElementCount > 0;
        const depth = level => level === "all" || level === "." ? 0 : level.split("/").length;
        direction ||= depth(explorer.level) < depth(renderedLevel) ? -1 : 1;
        if (transition) outgoingScene = leaveScene();
        renderedLevel = explorer.level;
        const query = state.query.trim().toLowerCase();
        let entries;
        if (state.selectedFlow !== null) {
          entries = [...new Set(sourceData.flows[state.selectedFlow].steps)].map(id => sourceNodes.get(id)).filter(Boolean);
        } else if (explorer.connection) {
          const ids = new Set([explorer.connection]);
          sourceData.edges.forEach(edge => { if (edge.from === explorer.connection || edge.to === explorer.connection) { ids.add(edge.from); ids.add(edge.to); } });
          entries = [...ids].map(id => sourceNodes.get(id));
        } else if (query || explorer.level === "all") {
          entries = sourceData.nodes.filter(node => `${node.id} ${node.label || ""} ${(node.symbols || []).join(" ")}`.toLowerCase().includes(query));
        } else {
          entries = groups.get(explorer.level).children.map(child => {
            if (child.kind === "node") return sourceNodes.get(child.id);
            const members = groupMembers(child.id);
            return { id: `group:${child.id}`, path: child.id, label: child.id.split("/").at(-1), type: "module", boundary: child.id,
              _group: child.id, _members: members, entrypoints: [], callers: [], callees: [], tests: [],
              evidence: { status: "inventory", locations: [] }, analysis: "group" };
          });
        }
        entries = entries.filter(node => node._group
          ? node._members.some(id => state.enabledTypes.has(sourceNodes.get(id).type) && (!explorer.changes || changedIds.has(id)))
          : state.enabledTypes.has(node.type) && (!explorer.changes || changedIds.has(node.id)));
        explorer.total = entries.length;
        explorer.page = Math.min(explorer.page, Math.max(0, Math.ceil(entries.length / 20) - 1));
        data.nodes = entries.slice(explorer.page * 20, (explorer.page + 1) * 20).map(node => ({ ...node, callers: [], callees: [] }));
        const membership = new Map();
        data.nodes.forEach(node => (node._members || [node.id]).forEach(id => membership.set(id, node.id)));
        const aggregate = new Map();
        sourceData.edges.forEach(edge => {
          const from = membership.get(edge.from), to = membership.get(edge.to);
          if (!from || !to || from === to) return;
          const key = `${from}\0${to}\0${edge.type}\0${Boolean(edge.type_only)}`;
          if (!aggregate.has(key)) aggregate.set(key, { ...edge, from, to, originals: [] });
          aggregate.get(key).originals.push(edge);
        });
        data.edges = [...aggregate.values()];
        const projected = new Map(data.nodes.map(node => [node.id, node]));
        data.edges.forEach(edge => { projected.get(edge.from).callees.push({ id: edge.to, type: edge.type }); projected.get(edge.to).callers.push({ id: edge.from, type: edge.type }); });
        if (state.selectedNode && !projected.has(state.selectedNode)) state.selectedNode = null;
        state.hoveredNode = null;
        state.overrides = new Map(restored?.overrides || []);

        document.getElementById("empty-view").hidden = data.nodes.length > 0;
        document.getElementById("announcer").textContent = `${entries.length} modules in this view. Page ${explorer.page + 1}.`;
        if (restored) setView(restored.view);
        else fitMap({ overview: true, animate: false });

      }

      function keyboardInput() { return document.documentElement.dataset.input === "keyboard"; }

      function snapshotView(reason = "navigation") {

      function rememberView(reason = "navigation") {

      function previousView() {
        if (navigation.index === 0) return;

      function nextView() {
        if (navigation.index === navigation.end) return;

        return { codemap: { index: navigation.index, end: navigation.end, snapshot: snapshotView(navigation.reason) } };

      function saveHistoryView() {
        if (navigation.ready) history.replaceState(historyEntry(), "");

      function queueHistorySave() {
        if (!navigation.ready || navigation.queued) return;

        Object.assign(state, { query: saved.query, selectedNode: saved.selectedNode, selectedFlow: saved.selectedFlow, enabledTypes: new Set(saved.enabledTypes) });
        document.getElementById("search").value = saved.query;

      function visibleNodes() {
        return data.nodes.filter(node => node._group || state.enabledTypes.has(node.type));
