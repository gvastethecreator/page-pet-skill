<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Page Pet collection: 23 transparent pets with gaze tracking and click reactions.">
  <meta name="color-scheme" content="dark">
  <title>Page Pet</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">p.</span>page pet</a>
    <nav aria-label="Primary">
      <a href="./playground/">Playground</a>
      <a href="https://github.com/gvastethecreator/page-pet-skill">GitHub</a>
    </nav>
  </header>
  <main>
    <section class="stage" aria-label="Selected pet">
      <page-pet id="pet" size="280" label="Moklo: click to react"></page-pet>
      <p id="pet-name">Moklo</p>
      <p class="hint">Move to look. Click to react.</p>
    </section>
    <section class="roster" aria-label="All pets">
      <div id="roster" class="roster-grid"></div>
    </section>
  </main>
  <footer>
    <code>npx skills add gvastethecreator/page-pet-skill --skill page-pet</code>
  </footer>
  <script type="module" src="./runtime/page-pet.js"></script>
  <script type="module" src="./site.js"></script>
</body>
</html>
